# Rental Monitor Configuration

# Circular search covering Irvine, Anaheim, Garden Grove, Tustin, and nearby
# central Orange County. RentCast allows one area query per API request, which
# keeps this daily monitor within the free request allowance.
search:
  latitude: 33.739224
  longitude: -117.858379
  radius: 18 # miles

# Empty means area-wide matching. Add street names later to narrow the search.
streets: []

# Maximum total monthly rent for whole-unit listings. These caps correspond to
# the private per-person ceiling supplied for a household matching the bedroom
# count. The monitor does not find individual room or roommate listings.
price_caps:
  2br: 3600
  3br: 5400

# Search whole 2- and 3-bedroom units.
bedrooms: "2:3"
